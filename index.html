<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperBits Labs</title>
<meta name="description" content="SuperBits Labs is a technology company. We build consumer products and the infrastructure they run on.">
<meta property="og:title" content="SuperBits Labs">
<meta property="og:description" content="A technology company. We build consumer products and the infrastructure they run on.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://superbits.in/">
<meta name="theme-color" content="#08090C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#08090C;
  --panel:#101217;
  --line:#1B1F27;
  --text:#E9EBF0;
  --muted:#858B99;
  --signal:#FF2D6F;
  --gutter:24px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  background:var(--ink);
  color:var(--text);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit}
::selection{background:var(--signal);color:#fff}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}

.wrap{width:100%;max-width:960px;margin:0 auto;padding-inline:var(--gutter)}

.mono{
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
}

/* ---- sky ---- */
/* Behind everything, above the body's ground colour. The content layers sit
   at z-index 1 so nothing here can ever land on top of a word. */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
header,main,.shipping,footer{position:relative;z-index:1}

/* ---- header ---- */
header{padding-block:22px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{display:flex;align-items:center;gap:11px;text-decoration:none}
.mark svg{display:block;flex:none}
.mark span{font-weight:700;letter-spacing:.06em;font-size:14px}
.bar a.contact{color:var(--muted);text-decoration:none;transition:color .15s}
.bar a.contact:hover{color:var(--text)}

/* ---- statement ---- */
main{flex:1;display:flex;align-items:center;padding-block:clamp(64px,14vh,140px)}
.eyebrow{color:var(--muted);display:block;margin-bottom:28px}
h1{
  margin:0 0 24px;
  font-weight:700;
  font-size:clamp(32px,6vw,58px);
  line-height:1.1;
  letter-spacing:-.025em;
  max-width:16ch;
  text-wrap:balance;
}
.lede{margin:0;color:var(--muted);font-size:clamp(16px,1.9vw,19px);line-height:1.6;max-width:52ch}

/* ---- currently shipping ---- */
.shipping{border-top:1px solid var(--line);padding-block:clamp(28px,5vw,40px)}
.shipping .mono{color:var(--muted);display:block;margin-bottom:18px}
.product{display:inline-flex;align-items:center;gap:14px;text-decoration:none}
/* The mark sits back until you reach for it — a reference, not a pitch. */
.product img{width:40px;height:40px;border-radius:9px;flex:none;opacity:.5;transition:opacity .18s}
.product .name{font-size:18px;font-weight:500;letter-spacing:-.01em;color:var(--text)}
.product .arrow{color:var(--muted);opacity:.7;transition:opacity .18s;display:block}
.product:hover img{opacity:1}
.product:hover .arrow{opacity:1;color:var(--text)}

/* ---- footer ---- */
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted)}
.footrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.footrow a{text-decoration:none}
.footrow a:hover{color:var(--text)}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<header>
  <div class="wrap bar">
    <span class="mark">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <g fill="#282D38">
          <rect x="0" y="0" width="5" height="5" rx="1"/><rect x="7.5" y="0" width="5" height="5" rx="1"/><rect x="15" y="0" width="5" height="5" rx="1"/>
          <rect x="0" y="7.5" width="5" height="5" rx="1"/><rect x="15" y="7.5" width="5" height="5" rx="1"/>
          <rect x="0" y="15" width="5" height="5" rx="1"/><rect x="7.5" y="15" width="5" height="5" rx="1"/><rect x="15" y="15" width="5" height="5" rx="1"/>
        </g>
        <rect x="7.5" y="7.5" width="5" height="5" rx="1" fill="#FF2D6F"/>
      </svg>
      <span>SUPERBITS&nbsp;LABS</span>
    </span>
    <a class="contact mono" href="mailto:info.super.bits@gmail.com">Contact</a>
  </div>
</header>

<main>
  <div class="wrap">
    <span class="mono eyebrow">Technology company · India</span>
    <h1>We&rsquo;re a technology company. The rest is coming.</h1>
    <p class="lede">
      SuperBits Labs builds consumer products and the infrastructure they run on.
      More to show here shortly.
    </p>
  </div>
</main>

<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');
  var fine = window.matchMedia('(pointer: fine)');

  // Three depths. Having the near layer move and react more than the far one
  // is what reads as distance — a single flat field of dots reads as noise.
  var LAYERS = [
    { depth: 0.30, size: 0.65, alpha: 0.26, drift: 3,  twinkle: 0.7 },
    { depth: 0.62, size: 0.95, alpha: 0.38, drift: 6,  twinkle: 1.0 },
    { depth: 1.00, size: 1.40, alpha: 0.55, drift: 10, twinkle: 1.4 }
  ];
  var REACH = 150;   // px around the cursor that brightens
  var SHIFT = 26;    // px of parallax at the nearest layer

  var stars = [], w = 0, h = 0, raf = null, last = 0;
  var pointer = { nx: 0.5, ny: 0.5, x: -1e4, y: -1e4, live: false };
  var eased = { x: 0.5, y: 0.5 };

  function build() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Counted by area, so a phone doesn't draw a desktop's worth of stars.
    var count = Math.min(Math.round(w * h / 5200), 260);
    stars = [];
    for (var i = 0; i < count; i++) {
      var layer = LAYERS[i % LAYERS.length];
      stars.push({
        layer: layer,
        x: Math.random() * w,
        y: Math.random() * h,
        r: layer.size * (0.6 + Math.random() * 0.8),
        vx: (Math.random() - 0.5) * layer.drift,
        vy: layer.drift * (0.25 + Math.random() * 0.4),
        phase: Math.random() * Math.PI * 2,
        // A handful carry the brand colour. Any more and it stops being a
        // night sky and starts being a logo.
        warm: Math.random() < 0.07
      });
    }
  }

  function paint(now, moving) {
    ctx.clearRect(0, 0, w, h);
    var px = (eased.x - 0.5) * SHIFT;
    var py = (eased.y - 0.5) * SHIFT;

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var x = s.x - px * s.layer.depth;
      var y = s.y - py * s.layer.depth;
      var a = s.layer.alpha;
      var r = s.r;

      if (moving) {
        a *= 0.64 + 0.36 * Math.sin(now * 0.0011 * s.layer.twinkle + s.phase);
      }
      if (pointer.live) {
        var dx = x - pointer.x, dy = y - pointer.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < REACH) {
          var near = 1 - d / REACH;
          a = Math.min(1, a + near * near * 0.55);
          r += near * near * 1.1;
        }
      }

      ctx.globalAlpha = a;
      ctx.fillStyle = s.warm ? '#FF2D6F' : '#E9EBF0';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    eased.x += (pointer.nx - eased.x) * 0.05;
    eased.y += (pointer.ny - eased.y) * 0.05;

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.y - 3 > h) { s.y = -3; s.x = Math.random() * w; }
      if (s.x < -3) s.x = w + 3; else if (s.x > w + 3) s.x = -3;
    }
    paint(now, true);
    raf = requestAnimationFrame(frame);
  }

  function start() {
    stop();
    if (still.matches) { paint(0, false); return; }   // one static sky, still a sky
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
  }

  build();
  start();

  // Mobile browsers fire resize when the URL bar slides away. Rebuilding on
  // that would reshuffle the whole sky mid-scroll, so only a real change counts.
  var lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW && Math.abs(window.innerHeight - lastH) < 120) return;
    lastW = window.innerWidth; lastH = window.innerHeight;
    build();
    start();
  });

  // Hover only where there is a real cursor; a touch screen has none, and the
  // drift is the whole effect there.
  if (fine.matches) {
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse') return;
      pointer.live = true;
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.nx = e.clientX / window.innerWidth;
      pointer.ny = e.clientY / window.innerHeight;
      if (still.matches) paint(0, false);
    }, { passive: true });

    // pointerleave doesn't fire on window. A mouseout with no relatedTarget
    // is the one event that reliably means "the cursor left the page".
    var release = function () {
      pointer.live = false;
      pointer.nx = 0.5;
      pointer.ny = 0.5;
      if (still.matches) paint(0, false);
    };
    document.addEventListener('mouseout', function (e) {
      if (!e.relatedTarget) release();
    });
    window.addEventListener('blur', release);
  }

  // Nothing to animate for a tab nobody is looking at.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });
})();
</script>

</body>
</html>
